name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  RUST_VERSION: '1.88.0'
  JAVA_VERSION: '17'

jobs:
  # Rust Core 多平台编译
  build-rust-core:
    name: Build Rust Core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          # macOS - disabled (requires macOS runner)
          # - os: macos-latest
          #   target: x86_64-apple-darwin
          #   name: macos-x64
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          #   name: macos-arm64
          # Android ARM64
          - os: ubuntu-latest
            target: aarch64-linux-android
            name: android-arm64
            android: true
          # Android ARMv7
          - os: ubuntu-latest
            target: armv7-linux-androideabi
            name: android-armv7
            android: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 安装 Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      # 安装 Android NDK (仅 Android 构建)
      - name: Install Android NDK
        id: setup-ndk
        if: matrix.android == true
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      # 缓存 Cargo 依赖
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('rust_core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('rust_core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: rust_core/target
          key: ${{ runner.os }}-cargo-target-${{ matrix.target }}-v2-${{ hashFiles('rust_core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-${{ matrix.target }}-

      # 编译 Rust Core
      - name: Build Rust Core
        shell: bash
        working-directory: rust_core
        run: |
          if [ "${{ matrix.android }}" = "true" ]; then
            # Android 构建
            NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
            echo "Building for Android ${{ matrix.target }}"
            echo "NDK: $NDK_PATH"

            if [ "${{ matrix.target }}" = "aarch64-linux-android" ]; then
              export CC_aarch64_linux_android="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
              export CXX_aarch64_linux_android="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++"
              export AR_aarch64_linux_android="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
              export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
            else
              export CC_armv7_linux_androideabi="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
              export CXX_armv7_linux_androideabi="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++"
              export AR_armv7_linux_androideabi="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
              export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
            fi
            cargo build --release --target ${{ matrix.target }}
          else
            # Windows/Linux/macOS 构建
            cargo build --release --target ${{ matrix.target }}
          fi

      # 上传 Android .so 文件
      - name: Upload Android libraries
        if: matrix.android == true
        uses: actions/upload-artifact@v4
        with:
          name: rust-core-${{ matrix.name }}
          path: |
            rust_core/target/${{ matrix.target }}/release/liblocalfamily_asset_core.so
            rust_core/target/${{ matrix.target }}/release/*.a
          retention-days: 7

  # Flutter 应用构建
  build-flutter:
    name: Build Flutter (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    needs: build-rust-core
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            target: windows
            artifact_name: localfamily-asset-windows
          # Linux
          - os: ubuntu-latest
            target: linux
            artifact_name: localfamily-asset-linux
          # macOS - disabled (requires macOS runner)
          # - os: macos-latest
          #   target: macos
          #   artifact_name: localfamily-asset-macos
          # Android
          - os: ubuntu-latest
            target: android
            artifact_name: localfamily-asset-android
            android: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置 up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-stable-${{ hashFiles('flutter_app/pubspec.lock') }}

      # 启用 Linux 桌面支持
      - name: Enable Linux desktop
        if: matrix.target == 'linux'
        shell: bash
        working-directory: flutter_app
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux . --project-name localfamily_asset --org com.example

      # 安装 Linux 桌面依赖
      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      # 下载 Rust Core 编译产物
      - name: Download Rust Core (Android)
        if: matrix.android == true
        uses: actions/download-artifact@v4
        with:
          path: rust-core-*
          pattern: rust-core-*
          merge-multiple: true

      # 安装 Rust (Windows/Linux/macOS 需要本地编译 Rust FFI)
      - name: Install Rust for FFI
        if: matrix.android != true
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      # 编译 Rust Core (非 Android 平台)
      - name: Build Rust Core
        if: matrix.android != true
        shell: bash
        working-directory: rust_core
        run: cargo build --release

      # 设置 Android 环境
      - name: Setup Android
        if: matrix.android == true
        shell: bash
        run: |
          mkdir -p flutter_app/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p flutter_app/android/app/src/main/jniLibs/armeabi-v7a
          cp rust-core-aarch64-linux-android/release/liblocalfamily_asset_core.so flutter_app/android/app/src/main/jniLibs/arm64-v8a/ || echo "arm64 not found"
          cp rust-core-armv7-linux-androideabi/release/liblocalfamily_asset_core.so flutter_app/android/app/src/main/jniLibs/armeabi-v7a/ || echo "armv7 not found"

      # 获取依赖
      - name: Get Flutter dependencies
        shell: bash
        working-directory: flutter_app
        run: flutter pub get

      # 构建 Flutter 应用
      - name: Build Flutter app
        shell: bash
        working-directory: flutter_app
        run: |
          if [ "${{ matrix.target }}" = "windows" ]; then
            flutter build windows --release --verbose
          elif [ "${{ matrix.target }}" = "linux" ]; then
            flutter build linux --release --verbose
          elif [ "${{ matrix.target }}" = "android" ]; then
            flutter build apk --release --verbose
            flutter build appbundle --release --verbose
          fi

      # 复制 Rust DLL 到 Flutter Windows 构建输出目录
      - name: Copy Rust DLL for Windows
        if: matrix.target == 'windows'
        shell: bash
        run: |
          # 复制 DLL 到 Flutter 构建输出目录
          cp rust_core/target/release/localfamily_asset_core.dll flutter_app/build/windows/x64/runner/Release/
          echo "Copied localfamily_asset_core.dll to Flutter build output"

      # 打包 Windows 发布压缩包（exe 依赖同目录 DLL 与 data 资源，必须整目录分发）
      - name: Package Windows build
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path flutter_app/build/windows/x64/runner/Release/* -DestinationPath localfamily-asset-windows-x64.zip -Force

      # 打包 Linux 发布压缩包
      - name: Package Linux build
        if: matrix.target == 'linux'
        shell: bash
        run: tar -czf localfamily-asset-linux-x64.tar.gz -C flutter_app/build/linux/x64/release/bundle .

      # 复制 Android 发布包到工作区根目录（upload-artifact 以各文件最小公共目录为根打包，
      # 若直接引用深路径，解压后 APK/AAB 会嵌套在 dist/apk/release/ 下，Release 的 dist/* 匹配不到）
      - name: Package Android build
        if: matrix.target == 'android'
        shell: bash
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk localfamily-asset-android.apk
          cp flutter_app/build/app/outputs/bundle/release/app-release.aab localfamily-asset-android.aab

      # 列出构建产物（调试用）
      - name: List build outputs
        shell: bash
        working-directory: flutter_app
        run: |
          echo "=== Build directory structure ==="
          find build -type f -name "*.exe" -o -name "*.dll" -o -name "*.apk" -o -name "*.aab" -o -name "*.tar.gz" 2>/dev/null || echo "No build artifacts found"
          echo "=== Full directory tree ==="
          ls -la build/ || echo "No build directory"

      # 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: hashFiles('flutter_app/build/windows/x64/runner/Release/*.exe') != '' || hashFiles('flutter_app/build/linux/x64/release/bundle/*') != '' || hashFiles('flutter_app/build/app/outputs/apk/release/*.apk') != ''
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            flutter_app/build/windows/x64/runner/Release/
            flutter_app/build/linux/x64/release/bundle/
            flutter_app/build/app/outputs/apk/release/
            flutter_app/build/app/outputs/bundle/release/
          retention-days: 7
          if-no-files-found: warn

      # 上传发布包（zip/tar.gz/apk/aab，供 Release job 汇总）
      - name: Upload dist package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-dist
          path: |
            localfamily-asset-windows-x64.zip
            localfamily-asset-linux-x64.tar.gz
            localfamily-asset-android.apk
            localfamily-asset-android.aab
          retention-days: 7
          if-no-files-found: warn

  # 汇总各平台产物发布 GitHub Release（单点创建，避免多 job 并发竞态）
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-flutter
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all dist packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-dist"
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          files: dist/*
          generate_release_notes: true
          body: |
            ## 下载
            - **Windows**: localfamily-asset-windows-x64.zip（解压后运行 localfamily_asset.exe）
            - **Linux**: localfamily-asset-linux-x64.tar.gz
            - **Android APK**: localfamily-asset-android.apk
            - **Android App Bundle**: localfamily-asset-android.aab（用于应用商店上传）
