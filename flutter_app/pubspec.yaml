name: localfamily_asset
description: 隐财 (Yincai) - 本地加密的家庭资产登记管理工具 | 你的资产，只有你知道
publish_to: 'none'
version: 0.2.3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Window management for custom title bar
  window_manager: ^0.3.8

  # State management
  provider: ^6.1.1

  # Date formatting
  intl: ^0.20.2

  # Charts
  fl_chart: ^0.65.0

  # Utils
  uuid: ^4.2.2
  crypto: ^3.0.3

  # FFI
  ffi: ^2.1.0
  path_provider: ^2.1.1

  # 批量导入（CSV / Excel）解析
  csv: ^6.0.0
  excel: ^4.0.6

  # File picker for export/import
  file_picker: ^8.0.0

  # 拍照/相册选取（附件：保单/房产证照片；仅移动端使用，桌面端走 file_picker）
  image_picker: ^1.1.2

  # Shared preferences for settings
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # 桌面平台支持
  # Windows: 已配置
  # Linux: 需运行 `flutter config --enable-linux-desktop`
  # macOS: 需在 Mac 上运行 `flutter config --enable-macos-desktop`

  assets:
    - assets/images/
    - assets/icons/
    - assets/demo/
