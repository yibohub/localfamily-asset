name: localfamily_asset
description: 本地家庭资产管理器 - 安全加密的家庭资产追踪应用
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # FFI for Rust Core integration
  ffi: ^2.1.0

  # State management
  provider: ^6.1.1

  # Local database
  sqflite: ^2.3.0
  path: ^1.8.3

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # File picker
  file_picker: ^6.1.1

  # Date formatting
  intl: ^0.18.1

  # Charts
  fl_chart: ^0.65.0

  # Utils
  uuid: ^4.2.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  ffigen: ^9.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - ../rust_core/target/debug/
