name: localfamily_asset
description: 隐财 (Yincai) - 本地加密的家庭资产登记管理工具 | 你的资产，只有你知道
publish_to: 'none'
version: 0.3.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Window management for custom title bar
  window_manager: ^0.3.8

  # State management
  provider: ^6.1.1

  # Date formatting
  intl: ^0.20.2

  # Charts
  fl_chart: ^0.65.0

  # Utils
  uuid: ^4.2.2
  crypto: ^3.0.3

  # FFI
  ffi: ^2.1.0
  path_provider: ^2.1.1

  # 批量导入（CSV / Excel）解析
  csv: ^6.0.0
  excel: ^4.0.6

  # File picker for export/import
  file_picker: ^8.0.0

  # 拍照/相册选取（附件：保单/房产证照片；仅移动端使用，桌面端走 file_picker）
  image_picker: ^1.1.2

  # Shared preferences for settings
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # 桌面平台支持
  # Windows: 已配置
  # Linux: 需运行 `flutter config --enable-linux-desktop`
  # macOS: 需在 Mac 上运行 `flutter config --enable-macos-desktop`
  # 鸿蒙（ohos）: 宿主工程在 ohos/（脚手架已提交），需 ohos Flutter SDK
  #   （CPF-Flutter 基线，git 拉取指定 tag），完整流程见 docs/harmonyos-build.md

  assets:
    - assets/images/
    - assets/icons/
    - assets/demo/

# =============================================================================
# 鸿蒙（HarmonyOS NEXT / OpenHarmony）插件适配
#
# Flutter 官方插件不包含 ohos 平台实现，需用 CPF-Flutter 社区适配的
# `*_ohos` 版本经 dependency_overrides 引入（ROADMAP Phase 4）。
#
# ⚠️ 仅在用 ohos Flutter SDK 构建 HAP 前临时取消注释并补全 git 地址；
# dependency_overrides 对所有平台全局生效，平时保持注释可避免影响
# Windows/Linux/Android 既有依赖解析。具体 git 地址/版本以 CPF-Flutter
# 三方库适配清单为准（见 docs/harmonyos-build.md 第 2 步）。
# =============================================================================
# dependency_overrides:
#   path_provider:       # 数据库/导出目录（auth_provider、file_dialogs 等）
#     git:
#       url: "<CPF-Flutter 适配仓库地址>"
#       path: "packages/path_provider/path_provider_ohos"
#   shared_preferences:  # 主题设置（theme_provider）
#     git:
#       url: "<CPF-Flutter 适配仓库地址>"
#       path: "packages/shared_preferences/shared_preferences_ohos"
#   image_picker:        # 附件：拍照/相册（financial_record_detail_screen）
#     git:
#       url: "<CPF-Flutter 适配仓库地址>"
#       path: "packages/image_picker/image_picker_ohos"
#   file_picker:         # 附件：选择文件 / 桌面端文件对话框
#     git:
#       url: "<CPF-Flutter 适配仓库地址>"
#       path: "packages/file_picker/file_picker_ohos"

