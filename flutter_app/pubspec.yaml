name: localfamily_asset
description: 隐财 (Yincai) - 本地加密的家庭资产登记管理工具 | 你的资产，只有你知道
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.1

  # Date formatting
  intl: ^0.20.2

  # Charts
  fl_chart: ^0.65.0

  # Utils
  uuid: ^4.2.2
  crypto: ^3.0.3

  # FFI
  ffi: ^2.1.0
  path_provider: ^2.1.1

  # File picker for export/import
  file_picker: ^8.0.0

  # Shared preferences for settings
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/demo/
    - ../rust_core/target/debug/
